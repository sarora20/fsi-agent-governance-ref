[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsi-agent-governance-ref"
version = "0.6.0"
description = "Reference build: a governed, model-agnostic agent for a regulated financial-services workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sumir Arora" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "pyjwt[crypto]>=2.8",
  "opentelemetry-api>=1.39,<2",   # with the adk extra, google-adk 2.x narrows these to <=1.42.1
  "opentelemetry-sdk>=1.39,<2",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
adk = ["google-adk>=2.0"]  # 1.x resolves when a newer otel SDK is already pinned, and routes unknown tools differently
service = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "opentelemetry-exporter-otlp-proto-http>=1.39,<2"]
demo = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "anthropic>=0.40",
        "opentelemetry-exporter-otlp-proto-http>=1.39,<2"]
all = ["anthropic>=0.40", "boto3>=1.34", "google-adk>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27",
       "python-multipart>=0.0.9"]  # tests/fake_keycloak.py posts a login form; otherwise only present via google-adk

[project.scripts]
govagent = "govagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govagent = ["policies/*.yaml", "demo/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
